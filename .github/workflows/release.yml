name: Build plugin release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  # The whole security gate must pass on the released commit before the ZIP
  # is built and attached.
  security-gate:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-gate.yml
  package:
    permissions:
      contents: write
    needs: security-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p dist/adventistai-cookie-consent
          cp -R adventistai-cookie-consent.php includes assets readme.txt uninstall.php dist/adventistai-cookie-consent/
          (cd dist && zip -r wp-cookie-consent.zip adventistai-cookie-consent)
      - name: Attach ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/wp-cookie-consent.zip --clobber
