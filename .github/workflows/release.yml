name: Build plugin release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p dist/adventistai-cookie-consent
          cp -R adventistai-cookie-consent.php includes assets readme.txt uninstall.php dist/adventistai-cookie-consent/
          (cd dist && zip -r wp-cookie-consent.zip adventistai-cookie-consent)
      - name: Attach ZIP to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/wp-cookie-consent.zip --clobber